<text x="72" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="2.4">AGENT-EVAL-HARNESS</text>
<text x="72" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="680" fill="#0b0b0b" text-anchor="start" letter-spacing="-0.8">Is it good enough? Does it stay in bounds?</text>
<text x="72" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start" >Two things to know before an agent is allowed to merge anything.</text>
<text x="72" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.6">SOLVE RATE, 95% INTERVAL, 36 PAIRED RUNS</text><line x1="182.0" y1="296" x2="182.0" y2="470" stroke="#e1e0d9"/><text x="182.0" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="middle" >0%</text><line x1="362.0" y1="296" x2="362.0" y2="470" stroke="#e1e0d9"/><text x="362.0" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="middle" >50%</text><line x1="542.0" y1="296" x2="542.0" y2="470" stroke="#e1e0d9"/><text x="542.0" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="middle" >100%</text><text x="72" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start" >Steady</text><line x1="507.4" y1="340" x2="542.0" y2="340" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="542.0" cy="340" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="542.0" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle" >100%</text><text x="72" y="426" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start" >Buggy</text><line x1="254.7" y1="420" x2="360.9" y2="420" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="301.9" cy="420" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="301.88" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica,