-width="2.2" stroke-linecap="round"/><text x="1110" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#b02a2a" text-anchor="start" >escaped</text><text x="720" y="500" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start" >Shortener past fetch limit</text><circle cx="1004" cy="494" r="9" fill="#0ca30c"/><path d="M1000 494 l3 3.5 l6 -7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="499" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#006300" text-anchor="start" >blocked</text><circle cx="1096" cy="494" r="9" fill="#d03b3b"/><path d="M1092.5 490.5 l7 7 M1099.5 490.5 l-7 7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><text x="1110" y="499" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#b02a2a" text-anchor="start" >escaped</text><text x="720" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#898781" text-anchor="start" >The honest agent still finishes every task.</text>
