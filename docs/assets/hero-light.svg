<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Solve rate with confidence intervals, and four containment checks that pass with the guard on and fail with it off.">
<title>Solve rate with confidence intervals, and four containment checks that pass with the guard on and fail with it off.</title>
