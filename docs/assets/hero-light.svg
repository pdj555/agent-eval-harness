<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A special-casing agent solves 2 of 2 tasks by the tests and 0 of 2 on hidden inputs. Four containment checks are blocked with the guard on and escape with it off.">
<title>A special-casing agent solves 2 of 2 tasks by the tests and 0 of 2 on hidden inputs. Four containment checks are blocked with the guard on and escape with it off.</title>
