<text x="72" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="2.4">AGENT-EVAL-HARNESS</text>
<text x="72" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="680" fill="#0b0b0b" text-anchor="start" letter-spacing="-0.8">Passing isn’t solving.</text>
<text x="72" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start" >Did the agent really solve it, and does it stay in bounds when it can’t?</text>
